# Regenerates the contribution snake animation and publishes it to the
# `output` branch (never touches `main`). The README references the SVGs from
# that branch, so no generated artifacts are committed to main.
#
# Requirements:
#   - Repository → Settings → Actions → General → Workflow permissions must
#     allow "Read and write permissions" (needed only to push the `output`
#     branch with GITHUB_TOKEN).
name: Generate Contribution Snake

on:
  schedule:
    - cron: "30 0 * * *" # daily, 00:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (dark + light)
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: anthonyy616
          outputs: |
            dist/github-snake.svg?color_snake=%2358a6ff&color_dots=%23161b22,%23033a16,%23196c2e,%232ea043,%2356d364
            dist/github-snake-white.svg?color_snake=%232f81f7&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216e39

      - name: Publish snake SVGs to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          svgs=("${GITHUB_WORKSPACE}/dist/"*.svg)
          echo "SVG count in dist/: ${#svgs[@]}"
          if [ "${#svgs[@]}" -eq 0 ]; then
            echo "No SVG files were generated in ${GITHUB_WORKSPACE}/dist."
            exit 1
          fi

          remote="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          workdir="$(mktemp -d)"

          git init "$workdir"
          git -C "$workdir" config user.name "github-actions[bot]"
          git -C "$workdir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$workdir" remote add origin "$remote"

          if git -C "$workdir" ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git -C "$workdir" fetch --depth=1 origin output
            git -C "$workdir" checkout -B output FETCH_HEAD
          else
            git -C "$workdir" checkout --orphan output
          fi

          find "$workdir" -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "${svgs[@]}" "$workdir"/
          git -C "$workdir" add -A

          if git -C "$workdir" diff --cached --quiet; then
            echo "Snake SVGs are unchanged — nothing to publish."
            exit 0
          fi

          git -C "$workdir" commit -m "Regenerate contribution snake animation for anthonyy616 (auto)" --no-verify
          git -C "$workdir" push origin output --force
          echo "Published to output branch."

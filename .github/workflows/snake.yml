# Regenerates the contribution snake animation and publishes it to the
# `output` branch (never touches `main`). The README references the SVGs from
# that branch, so no generated artifacts are committed to main.
#
# Requirements:
#   - Repository → Settings → Actions → General → Workflow permissions must
#     allow "Read and write permissions" (needed only to push the `output`
#     branch with GITHUB_TOKEN).
name: Generate Contribution Snake

on:
  schedule:
    - cron: "30 0 * * *" # daily, 00:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/snake.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (dark + light)
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: anthonyy616
          outputs: |
            dist/github-snake.svg?color_snake=%2358a6ff&color_dots=%23161b22,%23033a16,%23196c2e,%232ea043,%2356d364
            dist/github-snake-white.svg?color_snake=%232f81f7&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216e39

      # Platane/snk can push via its npm wrapper only when the job's GITHUB_TOKEN
      # has write permission to the output branch, and job logs are not visible to
      # non-collaborators — so when it fails, you can't see why. The README for this
      # action explicitly recommends the manual checkout + git push path, which is
      # what we use here. The `output` branch is created on the first successful run.
      - name: Checkout output branch (create if missing)
        uses: actions/checkout@v4.4.0
        with:
          ref: output
          path: output-branch
          token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Publish snake SVGs to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DIST="dist"
          TMP="output-branch"
          SVG_COUNT=$(ls -1 "$DIST"/*.svg 2>/dev/null | wc -l)
          echo "SVG count in dist/: $SVG_COUNT"
          [ "$SVG_COUNT" -gt 0 ]

          if [ ! -d "$TMP/.git" ]; then
            echo "Initializing 'output' branch for the first time..."
            git init -b output "$TMP"
            cd "$TMP"
            echo "# Contribution snake animation (auto-generated)" > README.md
            git add README.md
            git commit -m "first commit on output branch"
            git push origin output
            echo "Pushed initial commit to origin/output"
          fi

          cd "$TMP"
          if git rev-parse --verify origin/output >/dev/null 2>&1; then
            git fetch origin output
            git reset --hard origin/output
          fi

          cp "$DIST"/*.svg . 2>/dev/null || true
          if git checkout --orphan output 2>/dev/null; then
            git add *.svg
          else
            echo "switching to orphan branch failed; staging all instead"
            git add *
          fi

          if git diff --cached --quiet; then
            echo "Snake SVGs are unchanged — nothing to publish."
            exit 0
          fi

          git commit -m "Regenerate contribution snake animation for anthonyy616 (auto)" --no-verify
          git push origin output --force
          echo "Published to output branch."

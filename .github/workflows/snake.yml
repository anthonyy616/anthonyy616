# Regenerates the contribution snake animation and publishes it to the
# `output` branch (never touches `main`). The README references the SVGs from
# that branch, so no generated artifacts are committed to main.
#
# Requirements:
#   - Repository → Settings → Actions → General → Workflow permissions must
#     allow "Read and write permissions" (needed only to push the `output`
#     branch with GITHUB_TOKEN).
name: Generate Contribution Snake

on:
  schedule:
    - cron: "30 0 * * *" # daily, 00:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/snake.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs (dark + light)
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: anthonyy616
          outputs: |
            dist/github-snake.svg?color_snake=%2358a6ff&color_dots=%23161b22,%23033a16,%23196c2e,%232ea043,%2356d364
            dist/github-snake-white.svg?color_snake=%232f81f7&color_dots=%23ebedf0,%239be9a8,%2340c463,%2330a14e,%23216e39

      - name: Ensure output branch exists (create if missing)
        uses: actions/checkout@v4.4.0
        with:
          repository: anthonyy616/anthonyy616
          ref: output
          path: output-branch
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1
        continue-on-error: true

      - name: Publish to output branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -d "output-branch/.git" ]; then
            echo "Creating output branch for the first time..."
            git init -b output output-branch
          fi
          cd output-branch
          cp -R ../dist/* .
          git checkout --orphan output 2>/dev/null || git checkout --orphan --force output 2>/dev/null || true
          git add .
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          description="Contribution snake animation for anthonyy616 (auto-regenerated by GitHub Actions)"
          git commit -m "$description" --no-verify
          git push origin output --force
